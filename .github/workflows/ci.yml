name: Django CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: us_stock_db
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: us_stock_db
      DB_USER: root
      DB_PASSWORD: test-password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      ALPHA_VANTAGE_API_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend
        run: python manage.py test stocks
